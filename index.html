    /* Animated Background */
    body::before{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background:linear-gradient(
        45deg,
        #ff00cc,
        #3333ff,
        #00eaff,
        #ff6600,

      z-index:-1;
    }

    @keyframes animateBg{

      50%{

      box-shadow:0 0 30px rgba(255,255,255,0.1);
    }

      font-weight:900;
      margin-bottom:30px;
